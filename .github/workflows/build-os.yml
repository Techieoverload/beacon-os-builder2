name: Build BeaconOS Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space & allocate swap
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true

          if ! swapon --show | grep -q "/swapfile"; then
            sudo fallocate -l 4G /swapfile 2>/dev/null || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096 status=none
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile || true
          fi

          df -h
          free -h

      - name: Set up QEMU emulation
        uses: docker/setup-qemu-action@v3

      - name: Clone Armbian Build Engine
        run: |
          git clone --depth 1 https://github.com/armbian/build armbian-build

      - name: Prepare RootFS Overlay & Userpatches
        run: |
          set -euo pipefail

          # 1. Copy userpatches from git repository into Armbian engine
          mkdir -p armbian-build/userpatches/overlay/usr/local/bin
          mkdir -p armbian-build/userpatches/overlay/etc/systemd/system
          cp -r userpatches/* armbian-build/userpatches/

          # 2. Fetch latest pre-built Go-IRL ARM64 binary
          TAG=$(curl -sfL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/e04/go-irl/releases/latest | jq -r '.tag_name')

          echo "Downloading Go-IRL release: $TAG"
          DOWNLOAD_URL="https://github.com/e04/go-irl/releases/download/${TAG}/go-irl-linux-arm64.zip"
          curl -fSL "$DOWNLOAD_URL" -o /tmp/go-irl.zip
          unzip -o /tmp/go-irl.zip -d armbian-build/userpatches/overlay/usr/local/bin/
          chmod +x armbian-build/userpatches/overlay/usr/local/bin/*

          # 3. Create Go-IRL Systemd Unit
          cat << 'EOF' > armbian-build/userpatches/overlay/etc/systemd/system/beacon-srtla.service
[Unit]
Description=Go-IRL SRTLA Service
After=network.target

[Service]
Type=simple
User=root
ExecStart=/usr/local/bin/go-irl -srtla-port 5000 -udp-port 5002 -srt-port 5001
Restart=always
RestartSec=3

[Install]
WantedBy=multi-user.target
EOF

      - name: Compile Orange Pi 5 Plus OS
        run: |
          sudo modprobe loop || true
          for i in {0..15}; do
            sudo mknod -m 0660 /dev/loop$i b 7 $i 2>/dev/null || true
          done

          cd armbian-build
          sudo ./compile.sh build \
            BOARD=orangepi5-plus \
            BRANCH=vendor \
            RELEASE=bookworm \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            KERNEL_BTF=no \
            PREFER_DOCKER=no \
            COMPRESS_OUTPUTIMAGE=sha,xz \
            EXPERT=yes

      - name: Upload Bootable OS Image
        uses: actions/upload-artifact@v4
        with:
          name: BeaconOS-OrangePi5Plus-Image
          path: armbian-build/output/images/*
